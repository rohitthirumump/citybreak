services:
  postgres:
    image: postgres:16
    container_name: citybreak-postgres
    environment:
      POSTGRES_DB: citybreak
      POSTGRES_USER: citybreak
      POSTGRES_PASSWORD: citybreak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  user-db:
    image: postgres:16
    container_name: user-service-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userservice
      POSTGRES_PASSWORD: userservice
    ports:
      - "5433:5432"
    volumes:
      - userdata:/var/lib/postgresql/data

volumes:
  pgdata:
  userdata: